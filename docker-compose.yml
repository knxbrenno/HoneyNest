services:
  honeynest:
    build: .
    container_name: honeynest
    restart: unless-stopped
    ports:
      - "22:2222"     # Mova o seu SSH real para outra porta antes (veja o README)
      - "23:2323"
      - "80:8080"
      - "21:2121"
      - "127.0.0.1:5000:5000"   # Painel acessível apenas localmente
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Volumes nomeados herdam as permissões do container (o processo não roda como root).
      - honeynest-data:/app/data
      - honeynest-logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  honeynest-data:
  honeynest-logs:
